name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate npm audit report (JSON)
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true

      - name: Enforce vulnerability policy
        run: |
          node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('reports/npm-audit.json','utf8')); const v=report.metadata?.vulnerabilities ?? {}; const high=Number(v.high ?? 0); const critical=Number(v.critical ?? 0); console.log('high=',high,'critical=',critical); if (high>0 || critical>0) { process.exit(1); }"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: reports/*.json
          if-no-files-found: error
